<!-- Supabase → Authentication → Emails → Reset password. Subject: Reset your Kalupi password -->
<!-- {{ .RedirectTo }} is /auth/confirm?next=/reset-password from forgot-password/actions.ts, so the token is appended with & -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1c1838">
  <h2 style="margin: 0 0 16px">Reset your password</h2>
  <p style="margin: 0 0 24px">Tap the button to choose a new password for your Kalupi account. The link works once.</p>
  <p style="margin: 0 0 24px">
    <a
      href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
      style="display: inline-block; background: #1c1838; color: #ffffff; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-weight: bold"
      >Choose a new password</a
    >
  </p>
  <p style="margin: 0; font-size: 13px; color: #5f5a7a">
    If you didn't ask to reset your password, you can ignore this email. Your password stays the same.
  </p>
</div>
